services:
  postgres:
    image: postgres:17-alpine
    container_name: credit-engine-postgres
    environment:
      POSTGRES_DB: credit_engine
      POSTGRES_USER: credit_engine
      POSTGRES_PASSWORD: ${DB_PASSWORD:-credit_engine}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit_engine -d credit_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
